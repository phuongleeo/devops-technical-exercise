name: Go

on:
  push:
    branches: ["main"]
    paths:
      - 'app/**'
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: go get .

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

  publish-and-release:
    name: Build Image & Create Release PR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/phuongleeo/greeter:${{ steps.vars.outputs.sha_short }}

      - name: Update Helm values and bump Chart version
        run: |
          # Update image tag in values.yaml
          yq e '.greeter.image.tag = "${{ steps.vars.outputs.sha_short }}"' -i helm/dev/values.yaml

          # Bump patch version in Chart.yaml (e.g. 0.1.0 -> 0.1.1)
          current=$(yq e '.version' helm/dev/Chart.yaml)
          IFS='.' read -r major minor patch <<< "$current"
          new_version="${major}.${minor}.$((patch + 1))"
          yq e ".version = \"${new_version}\"" -i helm/dev/Chart.yaml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: deploy image ${{ steps.vars.outputs.sha_short }} to dev"
          branch: release/deploy-${{ steps.vars.outputs.sha_short }}
          title: "chore: deploy image ${{ steps.vars.outputs.sha_short }} to dev"
          body: "Automated PR to deploy image tag `${{ steps.vars.outputs.sha_short }}` to the dev environment."
          base: main
